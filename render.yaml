# Render Blueprint for flow-api (backend). MongoDB = Atlas, Redis = Upstash.
# Atlas: Network Access must allow Render (0.0.0.0/0, auth still via DB user).
# After first deploy, set CORS_ORIGIN to your Vercel URL.
services:
  - type: web
    name: flow-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: node src/app.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: http://localhost:5173
